<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administración | HoteleriasYa</title>
    <link rel="icon" type="image/png" href="/src/assets/images/logoHoteleriasYa.png">
</head>
<body class="owner-app admin-app">
    <div id="adminGate" class="admin-gate" role="status">
        <p id="adminGateMessage">Comprobando sesión…</p>
        <button id="adminGateRetry" class="secondary" type="button" hidden>Reintentar</button>
    </div>
    <div id="adminShell" hidden>
        <main class="admin-main">
            <header class="admin-topbar">
                <a class="owner-brand" href="../"><img src="/src/assets/images/logoHoteleriasYa.png" alt="" width="40" height="40"> HoteleriasYa <span class="admin-label">Administración</span></a>
                <button id="adminLogout" class="secondary" type="button">Cerrar sesión</button>
            </header>
            <div class="panel-heading"><h1>Hoteles publicados</h1></div>
            <form id="hotelSearchForm" class="admin-tools" role="search">
                <label class="form-field admin-search">Buscar hoteles<input id="hotelSearch" type="search" placeholder="Nombre o ubicación" autocomplete="off"></label>
                <button id="hotelSearchSubmit" class="primary" type="submit">Buscar</button>
            </form>
            <div id="adminError" class="admin-error" role="alert" hidden>
                <span id="adminErrorMessage"></span>
                <button id="catalogRetry" class="secondary" type="button">Reintentar</button>
            </div>
            <div class="admin-table-wrap">
                <table class="admin-table" aria-label="Hoteles publicados">
                    <thead><tr><th scope="col">Alojamiento</th><th scope="col">Ubicación</th><th scope="col"><span class="sr-only">Ficha pública</span></th></tr></thead>
                    <tbody id="hotelRows"><tr><td colspan="3" class="admin-table-state">Cargando hoteles…</td></tr></tbody>
                </table>
            </div>
        </main>
    </div>
    <script type="module" src="/src/pages/admin-panel.ts"></script>
</body>
</html>
